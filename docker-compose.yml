services:
  mongodb:
    image: mongo:8.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "mongodb://127.0.0.1:27017/admin?directConnection=true", "--quiet", "--eval", "const h = db.hello(); quit(h.setName === 'rs0' && h.isWritablePrimary === true && typeof h.logicalSessionTimeoutMinutes === 'number' ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 120s

  mongo-rs-init:
    build:
      context: .
      dockerfile: server/Dockerfile
    entrypoint: ["node"]
    command: ["/app/docker/mongo-init.js"]
    restart: "no"
    environment:
      MONGODB_BOOTSTRAP_URI: mongodb://mongodb:27017/admin?directConnection=true
    volumes:
      - ./docker/mongo-init.js:/app/docker/mongo-init.js:ro
    depends_on:
      mongodb: { condition: service_started }

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    command: ["npm", "run", "start:api"]
    restart: unless-stopped
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongodb:27017/pulsewatch?replicaSet=rs0&directConnection=true
      REDIS_URL: redis://redis:6379
      API_PORT: 4000
    ports:
      - "4000:4000"
    depends_on:
      mongodb: { condition: service_healthy }
      redis: { condition: service_healthy }
      mongo-rs-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/v1/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: server/Dockerfile
    command: ["npm", "run", "start:worker"]
    restart: unless-stopped
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongodb:27017/pulsewatch?replicaSet=rs0&directConnection=true
      REDIS_URL: redis://redis:6379
    depends_on:
      mongodb: { condition: service_healthy }
      redis: { condition: service_healthy }
      mongo-rs-init: { condition: service_completed_successfully }

  scheduler:
    build:
      context: .
      dockerfile: server/Dockerfile
    command: ["npm", "run", "start:scheduler"]
    restart: unless-stopped
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongodb:27017/pulsewatch?replicaSet=rs0&directConnection=true
      REDIS_URL: redis://redis:6379
    depends_on:
      mongodb: { condition: service_healthy }
      redis: { condition: service_healthy }
      mongo-rs-init: { condition: service_completed_successfully }

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--mode", "docker"]
    environment:
      VITE_API_BASE_URL: /api/v1
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      api: { condition: service_healthy }

volumes:
  mongodb_data:
  redis_data:
